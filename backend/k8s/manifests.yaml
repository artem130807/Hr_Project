# ============================================================
# hr-namespace.yaml
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: hr-prod
---
# ============================================================
# hr-configmap.yaml
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: hr-config
  namespace: hr-prod
data:
  ENV: "PROD"
  ACCESS_TOKEN_EXPIRES: "30"
  REFRESH_TOKEN_EXPIRES: "20160"
  SERVICE_TOKEN_EXPIRES: "4320"
  POSTGRES_SCHEMA: "hr-platform"
  DB_CLIENT_ID: "db-service"
  BOT_NAME: ""
  BOT_SERVICE_CLIENT_ID: "bot-service"
  HH_SERVICE_CLIENT_ID: "hh-service"
  EMPLOYER_ID: ""
  HH_APP_NAME: "HR-Bot"
  HH_APP_VERSION: "1.0"
  FRONTEND_URL: ""
  HR_FRONTEND_BASE_URL: "https://hr-web.alt-cargo.tw1.ru"
  S3_ENDPOINT_URL: ""
  S3_REGION: "ru-1"
  S3_BUCKET: ""
  S3_PRESIGNED_TTL_SECONDS: "900"
  CANDIDATE_DOCS_TOKEN_TTL_HOURS: "168"
  HIRING_REQUEST_INVITE_TTL_HOURS: "168"

  DB_SERVICE_INTERNAL: "http://database-service:8000"
  DB_SERVICE_URL: "http://database-service:8000/v1"
  JWKS_URL: "http://database-service:8000/.well-known/jwks.json"
  BOT_SERVICE_INTERNAL: "http://bot-service:8002"
  HH_SERVICE_INTERNAL: "http://hh-service:8003"
  # Vacancy «сгенерировать описание» proxy: set to in-cluster AI, e.g. http://ai-service:8000/v1
  AI_SERVICE_URL: ""
  RABBITMQ_QUEUE_CANDIDATE_EVALUATE_REQUEST: "hr.candidate.evaluate.requested"
  RABBITMQ_QUEUE_CANDIDATE_EVALUATE_RESULT: "hr.candidate.evaluate.completed"

  # ERP sync/auth: secrets in hr-app-secret — ERP_BASE, ERP_BEARER_TOKEN,
  # and ERP_JWT_SECRET (must equal erp-backend SECRET_JWT).
  ERP_SYNC_ENABLED: "true"
  ERP_AUTH_ENABLED: "true"
  ERP_USERS_PATH: "/api/v2/users/"
  ERP_SYNC_INTERVAL_MINUTES: "60"
  ERP_SYNC_STARTUP_DELAY_SECONDS: "45"
  ERP_DEFAULT_ROLE: "dev"
  T2_CALL_SYNC_LOOKBACK_HOURS: "24"
  T2_CALL_SYNC_MAX_PAGES: "20"
  T2_ATS_TIMEOUT: "60"
  CALLS_ALLOWED_PHONES: "+7 902 001 37 28,+7 902 001 3728"
  T2_STT_BACKFILL_ENABLED: "true"
  T2_STT_BACKFILL_INTERVAL_MINUTES: "10"
  T2_STT_BACKFILL_BATCH_SIZE: "12"
  T2_STT_BACKFILL_REQUEST_DELAY_SECONDS: "1.0"
  T2_STT_BACKFILL_MAX_AGE_DAYS: "7"

---
# ============================================================
# DATABASE SERVICE
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-service
  namespace: hr-prod
  labels:
    app: database-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: database-service
  template:
    metadata:
      labels:
        app: database-service
    spec:
      containers:
        - name: database-service
          image: hr-platform/backend/database-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http

          envFrom:
            - secretRef:
                name: hr-db-secret
            - secretRef:
                name: hr-redis-secret
            - secretRef:
                name: hr-app-secret
            - configMapRef:
                name: hr-config
          # hr-app-secret MUST include:
          # - stable PRIVATE_KEY (PEM) for service JWTs
          # - ERP_JWT_SECRET (= erp-backend SECRET_JWT) for panel login
          # - ERP_BASE, ERP_BEARER_TOKEN (or ERP_API_KEY) for ERP API calls
          # - RABBITMQ_URL=amqp://USER:PASS@HOST:5672/ (same broker as message-service / erp)
          # - S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY for the private candidate-documents bucket

          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15

---
# ============================================================
# HR WORKER (Huey) — same image as database-service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-worker
  namespace: hr-prod
  labels:
    app: hr-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hr-worker
  template:
    metadata:
      labels:
        app: hr-worker
    spec:
      containers:
        - name: hr-worker
          image: hr-platform/backend/database-service:latest
          imagePullPolicy: Always
          command: ["huey_consumer", "app.worker.app.huey", "-w", "2", "-k", "thread"]
          envFrom:
            - secretRef:
                name: hr-db-secret
            - secretRef:
                name: hr-redis-secret
            - secretRef:
                name: hr-app-secret
            - configMapRef:
                name: hr-config
          env:
            # Bump this value to force a guaranteed hr-worker rollout.
            - name: HR_WORKER_ROLLOUT_REV
              value: "2026-08-26-stt-backfill-v1"
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: database-service
  namespace: hr-prod
spec:
  type: ClusterIP
  selector:
    app: database-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
# ============================================================
# BOT SERVICE
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-service
  namespace: hr-prod
  labels:
    app: bot-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bot-service
  template:
    metadata:
      labels:
        app: bot-service
    spec:
      containers:
        - name: bot-service
          image: hr-platform/backend/bot-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8002
              name: http

          envFrom:
            - secretRef:
                name: hr-redis-secret
            - secretRef:
                name: hr-app-secret
            - configMapRef:
                name: hr-config

          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"

          livenessProbe:
            httpGet:
              path: /openapi.json
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: bot-service
  namespace: hr-prod
spec:
  type: ClusterIP
  selector:
    app: bot-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002

---
# ============================================================
# HH SERVICE
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hh-service
  namespace: hr-prod
  labels:
    app: hh-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hh-service
  template:
    metadata:
      labels:
        app: hh-service
    spec:
      containers:
        - name: hh-service
          image: hr-platform/backend/hh-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8003
              name: http

          envFrom:
            - secretRef:
                name: hr-redis-secret
            - secretRef:
                name: hr-app-secret
            - configMapRef:
                name: hr-config

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"

          livenessProbe:
            httpGet:
              path: /openapi.json
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: hh-service
  namespace: hr-prod
spec:
  type: ClusterIP
  selector:
    app: hh-service
  ports:
    - name: http
      port: 8003
      targetPort: 8003


---
# ============================================================
# INGRESS (single host: /hh -> hh-service, everything else -> database-service)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hr-api
  namespace: hr-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - hr-platform.alt-cargo.tw1.ru
      secretName: hr-api-tls

  rules:
    - host: hr-platform.alt-cargo.tw1.ru
      http:
        paths:
          - path: /hh(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: hh-service
                port:
                  number: 8003
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: database-service
                port:
                  number: 8000
