name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false --runInBand

      - name: Resolve GitHub Pages base path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "PUBLIC_URL=" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_URL=/$repository_name" >> "$GITHUB_ENV"
          fi

      - name: Build GitHub Pages site
        working-directory: frontend
        env:
          CI: "true"
          REACT_APP_FORCE_REMOTE_API: "true"
          REACT_APP_API_URL: https://hr-platform.alt-cargo.tw1.ru
          REACT_APP_HH_API_URL: https://hr-platform.alt-cargo.tw1.ru
          REACT_APP_AI_API_URL: https://hr-platform.alt-cargo.tw1.ru
        run: |
          npm run build
          cp build/index.html build/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
