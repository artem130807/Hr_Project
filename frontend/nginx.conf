server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # message-service: REST + WebSocket. Same-origin keeps JWT/CORS handling
    # identical to ERP frontend and lets the SPA use /message-service by default.
    location /message-service/ {
        proxy_pass http://message-service.erp-prod.svc.cluster.local:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host message-service.erp-prod.svc.cluster.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Same-origin /v1 when REACT_APP_API_URL is empty in the SPA build.
    location /v1/ {
        proxy_pass https://hr-platform.alt-cargo.tw1.ru/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host hr-platform.alt-cargo.tw1.ru;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Actor-Id $http_x_actor_id;
        proxy_set_header X-Actor-Name $http_x_actor_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # HTML entry must never be cached — otherwise users keep old JS bundles
    # and need Ctrl+R after every deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files /index.html =404;
    }

    # Service workers must be revalidated so WebPush behavior can be upgraded.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
        try_files /sw.js =404;
    }

    location / {
        # SPA fallback: always revalidate HTML shell
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Hashed CRA assets are safe to cache forever (never /sw.js).
    location ~* ^/(?!sw\.js$).+\.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
