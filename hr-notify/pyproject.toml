[project]
name = "hr-notify"
version = "0.1.0"
description = "HR Telegram notifications from the hr.event.notify queue"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.4",
  "huey>=2.5.2",
  "pika>=1.3",
  "pydantic>=2",
  "redis>=4.5",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
